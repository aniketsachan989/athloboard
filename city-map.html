<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Radar GPS Map | Athloboard Athletic Ecosystem</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="shared/css/athloboard-core.css">
  <style>
    .map-container-wrap {
      max-width: 1400px;
      margin: 2.5rem auto 4rem;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 2rem;
      min-height: 75vh;
    }
    .map-sidebar {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      height: fit-content;
      max-height: 80vh;
    }
    .radar-canvas-box {
      background: #000;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 500px;
    }
    .radar-sweep {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      border: 1px solid rgba(212, 255, 0, 0.2);
      animation: sweepAnim 4s linear infinite;
      pointer-events: none;
    }
    .radar-sweep::after {
      content: '';
      position: absolute;
      width: 50%;
      height: 50%;
      top: 0; right: 0;
      background: linear-gradient(45deg, transparent, rgba(212, 255, 0, 0.15));
      border-radius: 0 100% 0 0;
    }
    @keyframes sweepAnim {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .map-pin-point {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(212, 255, 0, 0.2);
      border: 2px solid var(--accent-volt);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-volt);
      font-size: 0.8rem;
      cursor: pointer;
      box-shadow: 0 0 15px var(--accent-volt);
      transition: transform 0.2s ease;
    }
    .map-pin-point:hover {
      transform: scale(1.3);
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Sticky Navbar -->
  <header class="athlo-header">
    <a href="index.html" class="athlo-brand">
      <div class="athlo-brand-icon"><i class="fa-solid fa-bolt"></i></div>
      ATHLO<span>BOARD</span>
    </a>

    <ul class="athlo-nav-links">
      <li><a href="index.html" class="athlo-nav-link">Home</a></li>
      <li><a href="search-gyms.html" class="athlo-nav-link">Verified Gyms</a></li>
      <li><a href="marketplace.html" class="athlo-nav-link">Supplements</a></li>
      <li><a href="leaderboard.html" class="athlo-nav-link">SBD Rankings</a></li>
      <li><a href="competitions.html" class="athlo-nav-link">Championships</a></li>
      <li><a href="city-map.html" class="athlo-nav-link active">City Radar</a></li>
    </ul>

    <div class="athlo-nav-actions">
      <a href="signup.html" class="btn-ghost">Partner Apply</a>
      <a href="login.html" class="btn-volt">Business Login</a>
    </div>
  </header>

  <div class="map-container-wrap">
    <!-- Sidebar list -->
    <div class="map-sidebar">
      <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem;"><i class="fa-solid fa-satellite-dish text-volt"></i> Nearby Gyms &amp; Shops</h3>
      <p style="font-size: 0.8rem; color: var(--text-slate); margin-bottom: 1rem;">GPS coordinates verified by Phase 1 &amp; 2 inspectors.</p>
      
      <div id="pins-list" style="overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem;">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- Simulated Map Radar -->
    <div class="radar-canvas-box">
      <div class="radar-sweep"></div>
      
      <!-- Coordinate Grid Lines -->
      <div style="position: absolute; width: 100%; height: 1px; background: rgba(255, 255, 255, 0.06);"></div>
      <div style="position: absolute; height: 100%; width: 1px; background: rgba(255, 255, 255, 0.06);"></div>
      
      <!-- Pins -->
      <div class="map-pin-point" style="top: 35%; left: 42%;" onclick="selectPin('GYM-101')" title="Titan Iron & Fitness Club">
        <i class="fa-solid fa-dumbbell"></i>
      </div>
      <div class="map-pin-point" style="top: 55%; left: 68%; border-color: var(--accent-cyan); color: var(--accent-cyan); box-shadow: 0 0 15px var(--accent-cyan); background: rgba(0, 242, 254, 0.2);" onclick="selectPin('VEN-301')" title="Apex Sports Nutrition">
        <i class="fa-solid fa-store"></i>
      </div>
      <div class="map-pin-point" style="top: 60%; left: 30%; border-color: var(--accent-gold); color: var(--accent-gold); box-shadow: 0 0 15px var(--accent-gold); background: rgba(255, 230, 0, 0.2);" onclick="selectPin('GYM-102')" title="Olympus Strength Arena">
        <i class="fa-solid fa-dumbbell"></i>
      </div>

      <div style="position: absolute; bottom: 1rem; left: 1rem; background: rgba(17, 18, 22, 0.85); padding: 0.5rem 1rem; border-radius: var(--radius-sm); font-size: 0.75rem; border: 1px solid var(--border-subtle);">
        <i class="fa-solid fa-crosshairs text-volt"></i> Live Radar: <strong>Mumbai &amp; NCR Grid Active</strong>
      </div>
    </div>
  </div>

  <script src="shared/js/athlo-db.js"></script>
  <script src="shared/js/athlo-animations.js"></script>
  <script>
    function renderPinsList() {
      const list = document.getElementById('pins-list');
      list.innerHTML = `
        <div class="athlo-card" style="padding: 1rem; border-left: 3px solid var(--accent-volt); cursor: pointer;" onclick="selectPin('GYM-101')">
          <span class="athlo-badge badge-verified" style="font-size: 0.65rem; margin-bottom: 0.25rem;">VERIFIED GYM</span>
          <h4 style="font-size: 0.95rem; margin-bottom: 0.2rem;">Titan Iron &amp; Fitness Club</h4>
          <div style="font-size: 0.75rem; color: var(--text-slate);"><i class="fa-solid fa-location-dot text-volt"></i> Andheri West (4,500kg Plates)</div>
        </div>

        <div class="athlo-card" style="padding: 1rem; border-left: 3px solid var(--accent-cyan); cursor: pointer;" onclick="selectPin('VEN-301')">
          <span class="athlo-badge badge-cyan" style="font-size: 0.65rem; margin-bottom: 0.25rem;">VERIFIED VENDOR</span>
          <h4 style="font-size: 0.95rem; margin-bottom: 0.2rem;">Apex Sports Nutrition</h4>
          <div style="font-size: 0.75rem; color: var(--text-slate);"><i class="fa-solid fa-location-dot text-cyan"></i> Phoenix Marketcity, Kurla</div>
        </div>

        <div class="athlo-card" style="padding: 1rem; border-left: 3px solid var(--accent-gold); cursor: pointer;" onclick="selectPin('GYM-102')">
          <span class="athlo-badge badge-gold" style="font-size: 0.65rem; margin-bottom: 0.25rem;">VERIFIED GYM</span>
          <h4 style="font-size: 0.95rem; margin-bottom: 0.2rem;">Olympus Strength Arena</h4>
          <div style="font-size: 0.75rem; color: var(--text-slate);"><i class="fa-solid fa-location-dot text-gold"></i> Sector 29, Gurugram (6,200kg Plates)</div>
        </div>
      `;
    }

    function selectPin(id) {
      alert(`Focused facility details: ${id}`);
    }

    document.addEventListener('DOMContentLoaded', renderPinsList);
  </script>
</body>
</html>
